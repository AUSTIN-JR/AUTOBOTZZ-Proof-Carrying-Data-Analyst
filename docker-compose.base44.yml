services:
  web:
    image: nginx:1.27-alpine
    labels:
      base44.project: "Proof-Carrying Data Analyst"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./proof-carrying-analyst:/usr/share/nginx/html:ro
      - ./proof-carrying-analyst/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
