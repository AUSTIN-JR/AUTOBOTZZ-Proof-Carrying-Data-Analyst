<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proof-Carrying Data Analyst · Trusted insights, backed by evidence</title>
  <meta name="description" content="Proof-Carrying Data Analyst — every metric, chart and AI insight carries a reproducible evidence trail." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 6l8 3.4v6.2c0 5-3.4 8.9-8 10.4-4.6-1.5-8-5.4-8-10.4V9.4L16 6z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12.4 15.8l2.5 2.5 4.8-5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to main content</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7.5 3v6c0 4.5-3.2 8.2-7.5 9.5C7.7 20.2 4.5 16.5 4.5 12V6L12 3z"/><path d="M9 12.2l2 2 4-4.2"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Proof-Carrying</strong>
          <span>Data Analyst</span>
        </span>
      </div>

      <div class="workspace-switch" id="workspaceSwitch" role="button" tabindex="0" aria-label="Current workspace">
        <span class="ws-avatar">AR</span>
        <span class="ws-copy">
          <strong>Acme Retail Analytics</strong>
          <span>Enterprise workspace</span>
        </span>
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" href="#/overview" data-route="overview">
          <span class="nav-icon"></span><span class="nav-label">Overview</span>
        </a>
        <a class="nav-item" href="#/datasets" data-route="datasets">
          <span class="nav-icon"></span><span class="nav-label">Datasets</span>
        </a>
        <a class="nav-item" href="#/studio" data-route="studio">
          <span class="nav-icon"></span><span class="nav-label">Analysis Studio</span>
        </a>
        <a class="nav-item" href="#/visualizations" data-route="visualizations">
          <span class="nav-icon"></span><span class="nav-label">Visualizations</span>
        </a>
        <a class="nav-item" href="#/insights" data-route="insights">
          <span class="nav-icon"></span><span class="nav-label">AI Insights</span>
          <span class="nav-count" id="navInsightCount"></span>
        </a>
        <a class="nav-item" href="#/evidence" data-route="evidence">
          <span class="nav-icon"></span><span class="nav-label">Evidence Vault</span>
          <span class="nav-count nav-count-quiet" id="navEvidenceCount"></span>
        </a>
        <a class="nav-item" href="#/reports" data-route="reports">
          <span class="nav-icon"></span><span class="nav-label">Reports</span>
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <span class="nav-icon"></span><span class="nav-label">Settings</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="trust-card">
          <span class="trust-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v6c0 4.5-3.2 8.2-7.5 9.5C7.7 20.2 4.5 16.5 4.5 12V6L12 3z"/><path d="M9 12.2l2 2 4-4.2"/></svg>
          </span>
          <div>
            <strong>Evidence coverage</strong>
            <span id="coverageStat">—</span>
          </div>
        </div>
        <p class="sidebar-note">Demo workspace · data stored locally in this browser.</p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="globalSearch" type="search" placeholder="Search datasets, insights, evidence…" autocomplete="off"
            aria-label="Global search" aria-controls="searchResults" aria-expanded="false" />
          <kbd class="search-kbd">/</kbd>
          <div class="search-results" id="searchResults" role="listbox" aria-label="Search results" hidden></div>
        </div>

        <div class="topbar-actions">
          <label class="dataset-select" for="datasetSelect">
            <span class="sr-only">Active dataset</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>
            <select id="datasetSelect"></select>
          </label>

          <button class="icon-btn" id="notificationBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 14 18 8z"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
            <span class="notif-dot" id="notifDot" hidden></span>
          </button>

          <button class="btn btn-primary btn-upload" id="uploadBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span>Upload Dataset</span>
          </button>

          <button class="user-menu-btn" id="userMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Open user menu">
            <span class="avatar avatar-md avatar-violet" id="topAvatar">AM</span>
            <span class="user-menu-copy">
              <strong id="topUserName">Alex Morgan</strong>
              <span id="topUserRole">Head of Analytics</span>
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>

        <div class="dropdown" id="notifMenu" hidden role="menu" aria-label="Notifications"></div>
        <div class="dropdown" id="userMenu" hidden role="menu" aria-label="User menu"></div>
      </header>

      <main class="view" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div class="mobile-scrim" id="mobileScrim" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>window.Chart || document.write('<script src="vendor/chart.umd.min.js"><\/script>');</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
